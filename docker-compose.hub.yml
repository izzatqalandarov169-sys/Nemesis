# =============================================================================
# NEMESIS â€” Docker Hub (pre-built images, no git clone needed)
# =============================================================================
#
# Local-only quick start (HTTP, no TLS â€” fine for personal use on this machine):
#   curl -fsSL https://raw.githubusercontent.com/Archsec-Emman/NEMESIS/main/docker-compose.hub.yml -o docker-compose.yml
#   docker compose up -d
#   open http://localhost:31337
#
# LAN sharing (HTTP â€” acceptable on a trusted home/office network):
#   FRONTEND_BIND=0.0.0.0 docker compose up -d
#
# For HTTPS (LAN with cert, or public domain with Let's Encrypt), use the git
# repo and ./start.sh which adds Caddy as a TLS reverse proxy:
#   git clone https://github.com/Arc-Cyber-Arsenal/Nemesis.git && cd NEMESIS
#   ./start.sh --lan                          # https://<LAN_IP>
#   ./start.sh --domain nemesis.example.com      # https://nemesis.example.com (Let's Encrypt)
#
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: nemesis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nemesis
      POSTGRES_PASSWORD: nemesis_secure_password_change_me
      POSTGRES_DB: nemesis_assessments
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nemesis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemesis"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Docker Socket Proxy â€” filtered Docker API for the backend.
  # Only inspect/exec/start allowed; run/create/volumes blocked.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: nemesis_docker_proxy
    restart: unless-stopped
    environment:
      POST: 1
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      SWARM: 0
      BUILD: 0
      AUTH: 0
      SECRETS: 0
      PLUGINS: 0
      INFO: 0
      VERSION: 0
      EVENTS: 0
      DISTRIBUTION: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nemesis-network

  backend:
    image: archsec-emman/nemesis-backend:latest
    container_name: nemesis_backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: nemesis
      POSTGRES_PASSWORD: nemesis_secure_password_change_me
      POSTGRES_DB: nemesis_assessments
      POSTGRES_HOST: postgres
      BACKEND_CORS_ORIGINS: "http://localhost:31337,http://127.0.0.1:31337"
      ENVIRONMENT: production
      DEFAULT_CONTAINER_NAME: nemesis-pentest
      CONTAINER_WORKSPACE_BASE: /workspace
      DOCKER_HOST: tcp://docker-proxy:2375
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_logs:/app/logs
    networks:
      - nemesis-network
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: archsec-emman/nemesis-frontend:latest
    container_name: nemesis_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:31337:80"
    networks:
      - nemesis-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nemesis-pentest:
    image: archsec-emman/nemesis-pentest:latest
    container_name: nemesis-pentest
    restart: unless-stopped
    tty: true
    stdin_open: true
    volumes:
      - workspaces:/workspace
    networks:
      - pentest-network

volumes:
  postgres_data:
    name: nemesis_postgres_data
  backend_logs:
  workspaces:

networks:
  nemesis-network:
    name: nemesis-network
    driver: bridge
  pentest-network:
    name: nemesis-pentest-network
    driver: bridge
